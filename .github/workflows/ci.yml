name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端 (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: oxlint
        run: npm run lint
      - name: typecheck + build
        run: npm run build
      - name: 上传前端产物（供后端 embed 编译）
        uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: server/webdist
          if-no-files-found: error

  backend:
    name: Go 后端 (vet + test, 含前端产物)
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - name: 下载前端产物到 server/webdist
        uses: actions/download-artifact@v4
        with:
          name: webdist
          path: server/webdist
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  mcp:
    name: MCP 服务 (vet + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: mcp/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
