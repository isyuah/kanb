name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端 (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: oxlint
        run: npm run lint
      - name: typecheck + build
        run: npm run build
      - name: 上传前端产物（供后端 embed 编译）
        uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: server/webdist
          if-no-files-found: error

  backend:
    name: Go 后端 (vet + test, 含前端产物)
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kanb
          POSTGRES_PASSWORD: kanb
          POSTGRES_DB: kanbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      KANB_TEST_DATABASE_URL: postgres://kanb:kanb@localhost:5432/kanbtest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - name: 下载前端产物到 server/webdist
        uses: actions/download-artifact@v4
        with:
          name: webdist
          path: server/webdist
      - name: go vet
        run: go vet ./...
      - name: go test（SQLite + PostgreSQL 双库 contract）
        run: go test -count=1 ./...

  mcp:
    name: MCP 服务 (vet + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: mcp/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
