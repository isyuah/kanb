name: Release MCP

# 打 v* 标签（如 v0.2.0）即触发：构建三平台 MCP 二进制并挂到对应 GitHub Release。
# 版本号取自标签（去 v 前缀），经 -ldflags 注入 mcp 的 version 变量。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: MCP ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: mcp/go.sum
      - name: 构建 kanb-mcp-${{ matrix.name }}${{ matrix.ext }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o kanb-mcp-${{ matrix.name }}${{ matrix.ext }} .
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kanb-mcp-${{ matrix.name }}
          path: mcp/kanb-mcp-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: 发布 GitHub Release（含校验和）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        run: |
          cd dist
          sha256sum kanb-mcp-* > SHA256SUMS
      - name: 创建/更新 Release 并挂产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
